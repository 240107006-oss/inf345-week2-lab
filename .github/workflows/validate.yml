# INF 345 - Week 2
#
# Read this file. In three weeks you will write one of these yourself.

name: Mark report.sh

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mark:
    name: Mark submission
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only your own folder, and nothing else in the repository.
      #
      # GitHub usernames keep their capital letters, so the comparison below is
      # deliberately case-insensitive: submissions/BolatK/ and submissions/bolatk/
      # are both accepted from the user BolatK, and neither is accepted from
      # anybody else.
      - name: Check what this pull request changes
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "Files changed:"
          echo "$changed" | sed 's/^/  /'

          outside=$(echo "$changed" | grep -vi "^submissions/$PR_AUTHOR/" || true)
          if [ -n "$outside" ]; then
            echo "::error::This pull request changes files outside submissions/$PR_AUTHOR/:"
            echo "$outside" | sed 's/^/  /'
            echo "::error::Week 2 adds one file: submissions/$PR_AUTHOR/report.sh"
            exit 1
          fi

      # A seed nobody can predict. A script that hardcodes last run's answers
      # fails here, which is the point.
      - name: Mark it
        env:
          PR_AUTHOR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login || '' }}
        run: |
          if [ -z "$PR_AUTHOR" ]; then
            echo "Push to main - nothing to mark."
            exit 0
          fi

          # Find the folder whatever case it was created in.
          dir=$(find submissions -maxdepth 1 -type d -iname "$PR_AUTHOR" | head -1)
          if [ -z "$dir" ]; then
            echo "::error::There is no submissions/$PR_AUTHOR/ folder in this pull request."
            echo "::error::Copy the EXAMPLE folder: cp -r submissions/EXAMPLE submissions/$PR_AUTHOR"
            exit 1
          fi
          if [ ! -f "$dir/report.sh" ]; then
            echo "::error::$dir/ exists but contains no report.sh."
            exit 1
          fi

          seed=$(( (RANDOM << 15) | RANDOM ))
          echo "Marking $dir/report.sh with seed $seed"
          python3 scripts/grade.py --script "$dir/report.sh" --seed "$seed"
